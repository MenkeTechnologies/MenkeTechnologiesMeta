name: Apps (Tauri)

# Builds the private Tauri apps (traderview / Audio-Haxor) from this PUBLIC
# meta repo, so their core CI runs on free public-repo Actions minutes instead
# of the apps' own (private, billed) Actions.
#
# This replicates each app's *core Linux build + tests* — the expensive, billed
# part — not their full multi-OS release-bundle jobs or repo-local doc gates.
# Private-repo access uses the SUBMODULE_PAT secret.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'   # weekly, Monday 06:30 UTC, against each app's main
  push:
    branches: [main]
    paths:
      - '.github/workflows/apps.yml'

jobs:
  traderview:
    name: traderview (Linux core)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout traderview (private) + submodules
        uses: actions/checkout@v6
        with:
          # SUBMODULE_PAT authenticates the private repo + its private vendored
          # submodules (frontend/vendor/zpwr-clip-engine, a Cargo path dep).
          repository: MenkeTechnologies/traderview
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: recursive
          path: app

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # actions/checkout's token authenticates the CHECKOUT only; cargo does its
      # own git fetches with libgit2 and sees no credential. src-tauri
      # git-depends on the private MenkeTechnologies/zpwr-account, and cargo
      # resolves the whole workspace graph even when that package is excluded
      # from the build — so without this the run dies in resolution with
      # "failed to authenticate when downloading repository". Hand cargo the
      # same PAT through the git CLI.
      # Carried through GIT_CONFIG_COUNT/KEY/VALUE rather than `git config --global`:
      # the env form scopes the rewrite to this job's steps instead of writing
      # ~/.gitconfig on a runner that later jobs may reuse. Every git invocation
      # honours it, including the ones cargo makes from ~/.cargo/git, which a
      # repo-local config would miss.
      - name: Authenticate cargo for private git dependencies
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${SUBMODULE_PAT}@github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          } >> "$GITHUB_ENV"

      # src-tauri (traderview-desktop) needs GTK/Webkit + has no lib tests, so
      # it is excluded from the Linux workspace build, mirroring the app's CI.
      - name: cargo check
        working-directory: app
        run: cargo check --workspace --all-targets --locked --exclude traderview-desktop

      - name: cargo test (lib)
        working-directory: app
        run: cargo test --workspace --locked --no-fail-fast --lib --exclude traderview-desktop

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend JS tests
        working-directory: app
        run: node --test frontend/tests/*.test.mjs

  audio-haxor:
    name: Audio-Haxor (Linux core)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Audio-Haxor (private) + submodules
        uses: actions/checkout@v6
        with:
          # SUBMODULE_PAT authenticates the private repo + its private vendored
          # submodules (frontend/lib/zpwr-clip-engine, a Cargo path dep).
          repository: MenkeTechnologies/Audio-Haxor
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: recursive
          path: app

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev cmake ninja-build libasound2-dev libfreetype6-dev \
            libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev xvfb

      # Same reason as the traderview job: actions/checkout's token authenticates the
      # checkout only, and src-tauri git-depends on the private zpwr-account, which cargo
      # fetches itself with libgit2 and no credential ("revision ... not found / failed to
      # authenticate"). Carried through GIT_CONFIG_* rather than `git config --global` so
      # the rewrite is scoped to this job instead of the runner's ~/.gitconfig.
      - name: Authenticate cargo for private git dependencies
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${SUBMODULE_PAT}@github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: pnpm install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Check i18n JSON key order
        working-directory: app
        run: pnpm run i18n:sort:check
      - name: Run JS tests
        working-directory: app
        run: node scripts/run-js-tests.mjs
      - name: Prepare audio-engine for Tauri externalBin
        working-directory: app
        env:
          AUDIO_ENGINE_TAURI_BIN_PROFILE: debug
        run: node scripts/prepare-audio-engine-audioengine.mjs
      - name: AudioEngine IPC tests (xvfb)
        working-directory: app
        run: xvfb-run -a node scripts/run-audio-engine-tests.mjs
      - name: Rust tests (library + integration)
        working-directory: app
        run: cargo test --manifest-path src-tauri/Cargo.toml

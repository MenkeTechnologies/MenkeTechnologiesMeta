<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MenkeTechnologies">
  <title>MenkeTechnologies</title>
  <!-- DIE. MT monogram inside a hex package with pin stubs.
       Ink is currentColor; the monogram takes the neon custom property, so one
       file recolors for every ground. On light grounds set it to the paper-safe
       #0069a8 - #00b0ff does not carry enough contrast on white. -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
    <path d="M32 6 L55 19 V45 L32 58 L9 45 V19 Z"/>
    <path d="M9 27 H2 M9 37 H2 M55 27 H62 M55 37 H62"/>
  </g>
  <!-- Butt caps, not square. Square caps extend every endpoint by half the
       stroke width, which closes the gap between the M and the T and fuses them
       into one blob. Butt caps make the drawn coordinates the real extents, so
       the 4-unit gap between the M at x=31 and the T at x=35 survives. -->
  <g fill="none" stroke="var(--neon, #00b0ff)" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M19 40 V26 L25 32 L31 26 V40"/>
    <path d="M35 26 H45 M40 26 V40"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MenkeTechnologies">
  <title>MenkeTechnologies</title>
  <!-- Favicon. Two reductions from the full mark, both forced by 16px:
       1. It carries its own ground. A tab strip may be light or dark and no
          currentColor is supplied to a favicon, so the mark cannot inherit.
       2. The hex package is dropped and the tile stands in for it. At 16px a
          stroked hex and the monogram inside it compete for the same pixels and
          both turn to mush - the monogram needs the whole tile to stay legible.
          The notches on the left and right edges carry the pin stubs over.
       Anything larger than a tab should use mark.svg or mark-compact.svg. -->
  <rect width="64" height="64" rx="12" fill="#0b1020"/>
  <g fill="none" stroke="#00b0ff" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M10 45 V21 L20 32 L30 21 V45"/>
    <path d="M35 21 H54 M44.5 21 V45"/>
  </g>
  <g fill="none" stroke="#8cdbff" stroke-width="4">
    <path d="M0 24 H4 M0 40 H4 M64 24 H60 M64 40 H60"/>
  </g>
</svg>

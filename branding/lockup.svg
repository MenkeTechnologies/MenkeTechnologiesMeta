<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 64" width="180" height="64" role="img" aria-label="MenkeTechnologies">
  <title>MenkeTechnologies</title>
  <!-- Horizontal lockup. The mark occupies x=2..62 including pin stubs; type
       starts at x=78, so the gap is 16 units - one quarter of the mark width.

       Both wordmark lines are set to the same ink width (100 units, measured on
       the mono stack rather than derived from an assumed advance). MENKE tracks
       to 6.0 at 26pt and TECHNOLOGIES to 2.9 at 9.5pt to land there. If the type
       is ever resized, re-measure both - do not scale the tracking, because the
       two lines have different character counts and will drift apart.

       Type is set live rather than outlined so the lockup stays editable.
       Outline it before sending to a press that will not have the face. -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
    <path d="M32 6 L55 19 V45 L32 58 L9 45 V19 Z"/>
    <path d="M9 27 H2 M9 37 H2 M55 27 H62 M55 37 H62"/>
  </g>
  <g fill="none" stroke="var(--neon, #00b0ff)" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M19 40 V26 L25 32 L31 26 V40"/>
    <path d="M35 26 H45 M40 26 V40"/>
  </g>
  <text x="78" y="32" fill="currentColor"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        font-size="26" font-weight="700" letter-spacing="6">MENKE</text>
  <text x="78" y="48" fill="var(--neon, #00b0ff)"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9.5" font-weight="400" letter-spacing="2.9">TECHNOLOGIES</text>
</svg>

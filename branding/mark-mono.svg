<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MenkeTechnologies">
  <title>MenkeTechnologies</title>
  <!-- DIE, single ink. Package and monogram both take currentColor, so this is
       the variant for one-colour print, foil, laser etch, and any context that
       cannot carry the cyan. Monogram stroke stays heavier than the package so
       the MT still reads as figure against the hex. -->
  <g fill="none" stroke="currentColor" stroke-linejoin="round">
    <path d="M32 6 L55 19 V45 L32 58 L9 45 V19 Z" stroke-width="3.5"/>
    <path d="M9 27 H2 M9 37 H2 M55 27 H62 M55 37 H62" stroke-width="3.5"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M19 40 V26 L25 32 L31 26 V40"/>
    <path d="M35 26 H45 M40 26 V40"/>
  </g>
</svg>

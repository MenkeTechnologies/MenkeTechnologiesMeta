<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MTOpensource">
  <title>MTOpensource</title>
  <!-- MTOpensource branch mark.

       The hex package and the MT monogram below are identical to
       branding/mark.svg. They are the family DNA - do not edit them here.

       This branch differs only in what fills the four corner voids the hexagon
       leaves empty: paired bars of uneven height. That is also why the detail
       sits out in the corners with air around it rather than tight against the
       package - drawn against the hex it reads as a double-stroke mistake, not
       a decision.

       The glyph is drawn once in the top-left void and mirrored into the other
       three, so the corners cannot drift out of symmetry.

       Accent #2ee65f on the void ground; use #157a33 on light grounds. -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
    <path d="M32 6 L55 19 V45 L32 58 L9 45 V19 Z"/>
  </g>
  <g fill="none" stroke="var(--neon, #2ee65f)" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M19 40 V26 L25 32 L31 26 V40"/>
    <path d="M35 26 H45 M40 26 V40"/>
  </g>
  <g class="corners">
    <g><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt"><path d="M3 8 V20 M9 11 V17"/></g></g>
    <g transform="translate(64,0) scale(-1,1)"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt"><path d="M3 8 V20 M9 11 V17"/></g></g>
    <g transform="translate(0,64) scale(1,-1)"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt"><path d="M3 8 V20 M9 11 V17"/></g></g>
    <g transform="translate(64,64) scale(-1,-1)"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt"><path d="M3 8 V20 M9 11 V17"/></g></g>
  </g>
</svg>

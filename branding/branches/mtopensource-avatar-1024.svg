<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="MTOpensource">
  <title>MTOpensource</title>
  <!-- MTOpensource GitHub avatar. The branch counterpart of
       branding/avatar-1024.svg: same ground, grid and glow, the branch mark
       from branches/mtopensource.svg in place of the parent DIE.

       The hex, the monogram and the four corner glyphs are the branch file's
       paths transformed, never redrawn. Package and corners take the branch
       hi tint #a5f5bd, the monogram the accent #2ee65f, exactly as
       ../logos-branches.html sets them on the void ground (the os-hi and os customs there).

       Scale differs from the parent avatar and this is the reason. GitHub
       crops to the circle inscribed in the square (centre 512, r=512), and the
       corner glyphs sit on the diagonal, which is where that circle cuts
       deepest - they reach further than the parent's pin stubs do laterally.
       Measured minimum enclosing radius of the drawn mark, by scale:

         x11    427px   (85px clearance)   hex 506px wide
         x12    466px   (46px clearance)   hex 552px wide   = this file
         x12.8  497px   (15px clearance)   hex 589px wide

       x12 is the compromise. The parent's 80px clearance is only reachable at
       x11, which drops the hex to 79% of the parent's 644px and reads as a
       different, smaller mark rather than a sibling. x12.8 is as large as the
       geometry goes and leaves the corner bars kissing the crop edge. At x12
       the bars still read as bars down to 40px.

       Grid takes the branch accent rather than the parent cyan - the one
       judgment call in this file. At 0.10 opacity it is barely a tint; flip
       the pattern stroke back to #00b0ff if the ground should stay constant
       across the family. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#2ee65f" stroke-width="1.5" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#grid)"/>

  <g transform="translate(128 128) scale(12)" filter="url(#glow)">
    <g fill="none" stroke="#a5f5bd" stroke-width="4" stroke-linejoin="round">
      <path d="M32 6 L55 19 V45 L32 58 L9 45 V19 Z"/>
    </g>
    <g fill="none" stroke="#2ee65f" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="butt">
      <path d="M19 40 V26 L25 32 L31 26 V40"/>
      <path d="M35 26 H45 M40 26 V40"/>
    </g>
    <g class="corners" fill="none" stroke="#a5f5bd" stroke-width="3" stroke-linecap="butt">
      <g><path d="M3 8 V20 M9 11 V17"/></g>
      <g transform="translate(64,0) scale(-1,1)"><path d="M3 8 V20 M9 11 V17"/></g>
      <g transform="translate(0,64) scale(1,-1)"><path d="M3 8 V20 M9 11 V17"/></g>
      <g transform="translate(64,64) scale(-1,-1)"><path d="M3 8 V20 M9 11 V17"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MTAudio">
  <title>MTAudio</title>
  <!-- MTAudio branch mark.

       The hex package and the MT monogram below are identical to
       branding/mark.svg. They are the family DNA - do not edit them here.

       This branch differs only in what fills the four corner voids the hexagon
       leaves empty: quarter arcs. That is also why the detail sits out
       in the corners with air around it rather than tight against the package -
       drawn against the hex it reads as a double-stroke mistake, not a decision.

       The glyph is drawn once in the top-left void and mirrored into the other
       three, so the corners cannot drift out of symmetry.

       Accent #ff2a6d on the void ground; use #c4004f on light grounds. -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
    <path d="M32 6 L55 19 V45 L32 58 L9 45 V19 Z"/>
  </g>
  <g fill="none" stroke="var(--neon, #ff2a6d)" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M19 40 V26 L25 32 L31 26 V40"/>
    <path d="M35 26 H45 M40 26 V40"/>
  </g>
  <g class="corners">
    <g><path d="M2 18 A8 8 0 0 1 10 10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="butt"/></g>
    <g transform="translate(64,0) scale(-1,1)"><path d="M2 18 A8 8 0 0 1 10 10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="butt"/></g>
    <g transform="translate(0,64) scale(1,-1)"><path d="M2 18 A8 8 0 0 1 10 10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="butt"/></g>
    <g transform="translate(64,64) scale(-1,-1)"><path d="M2 18 A8 8 0 0 1 10 10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="butt"/></g>
  </g>
</svg>

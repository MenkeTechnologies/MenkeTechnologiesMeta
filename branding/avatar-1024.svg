<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="MenkeTechnologies">
  <title>MenkeTechnologies</title>
  <!-- GitHub avatar. Same ground, grid and glow as icon-1024.svg; the only
       difference is the figure scale.

       GitHub crops an account avatar to a circle, so the safe area is the
       circle inscribed in the square (centre 512, r=512) and not the square.
       Measured minimum enclosing radius of the drawn mark: 493px at the x16
       scale icon-1024.svg uses (19px of clearance, the stubs all but touch the
       crop edge), 432px at the x14 scale used here (80px). The extra air is
       what keeps the pin stubs reading as stubs after the crop and after the
       downscale to the 40-60px GitHub actually renders in listings.

       Geometry is the canonical 64-unit mark transformed, never redrawn, so
       this file cannot drift from branding/mark.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#00b0ff" stroke-width="1.5" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#grid)"/>

  <g transform="translate(64 64) scale(14)" filter="url(#glow)">
    <g fill="none" stroke="#8cdbff" stroke-width="4" stroke-linejoin="round">
      <path d="M32 6 L55 19 V45 L32 58 L9 45 V19 Z"/>
      <path d="M9 27 H2 M9 37 H2 M55 27 H62 M55 37 H62"/>
    </g>
    <g fill="none" stroke="#00b0ff" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="butt">
      <path d="M19 40 V26 L25 32 L31 26 V40"/>
      <path d="M35 26 H45 M40 26 V40"/>
    </g>
  </g>
</svg>
